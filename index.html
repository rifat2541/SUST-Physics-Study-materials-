<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUST Physics Resource Hub</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        sustblue: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6',
                            800: '#1e40af', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Explorer Card Hover Effects */
        .explorer-card { transition: all 0.2s ease-in-out; }
        .explorer-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: opacity 300ms, transform 300ms; }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-sustblue-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center cursor-pointer" onclick="resetToHome()">
                    <i class="fa-solid fa-atom text-2xl mr-3 text-blue-300"></i>
                    <span class="font-bold text-lg md:text-xl tracking-wide">SUST Physics Hub</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="role-badge" class="hidden px-3 py-1 bg-green-500 text-white text-xs font-bold rounded-full shadow-sm">
                        <i class="fa-solid fa-user-shield mr-1"></i> Admin
                    </span>
                    <button id="btn-admin-toggle" onclick="toggleAdminAuth()" class="px-4 py-2 rounded-lg text-sm font-medium transition border border-transparent hover:bg-sustblue-800 text-gray-200">
                        <i class="fa-solid fa-lock mr-1.5"></i> Admin Access
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Admin Authentication Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm flex justify-center items-center z-50 hidden transition-opacity duration-300 opacity-0">
        <div id="auth-modal-content" class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 transform transition-transform duration-300 scale-95">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600 text-2xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
                <p class="text-sm text-gray-500 mt-1">Hint: Password is 1234</p>
            </div>
            
            <form onsubmit="verifyAdmin(event)">
                <div class="mb-5 relative">
                    <i class="fa-solid fa-key absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="password" id="admin-password" placeholder="Enter Password" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-lg tracking-widest">
                </div>
                <div class="flex space-x-3">
                    <button type="button" onclick="closeAdminAuth()" class="flex-1 py-3 bg-gray-100 text-gray-700 font-medium rounded-xl hover:bg-gray-200 transition">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-sustblue-900 text-white font-medium rounded-xl hover:bg-sustblue-800 transition shadow-md">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Explorer Area -->
    <main class="flex-grow flex flex-col max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Header & Breadcrumbs -->
        <div class="bg-white rounded-t-xl border-b border-gray-200 p-5 shadow-sm">
            <h1 class="text-xl font-bold text-gray-800 mb-3 flex items-center">
                <i class="fa-brands fa-google-drive text-sustblue-500 mr-2 text-2xl"></i> Resource Drive
            </h1>
            <div id="breadcrumbs" class="flex items-center flex-wrap text-sm sm:text-base font-medium text-gray-600 gap-2 bg-gray-50 px-4 py-2.5 rounded-lg border border-gray-100">
                <!-- Breadcrumbs injected via JS -->
            </div>
        </div>

        <!-- Contextual Admin Action Bar (Hidden for Students) -->
        <div id="admin-action-bar" class="hidden bg-blue-50 border-x border-b border-blue-100 p-5 shadow-sm flex-col md:flex-row gap-4 items-center">
            <!-- Create Folder -->
            <form onsubmit="createFolder(event)" class="w-full md:w-1/2 flex gap-2">
                <input type="text" id="new-folder-name" required placeholder="New Folder Name..." class="flex-grow px-4 py-2.5 rounded-lg border border-blue-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <button type="submit" class="px-5 py-2.5 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 transition shadow-sm whitespace-nowrap flex items-center">
                    <i class="fa-solid fa-folder-plus mr-2"></i> Create
                </button>
            </form>

            <div class="hidden md:block w-px h-10 bg-blue-200 mx-2"></div>

            <!-- Upload Files -->
            <form onsubmit="uploadFiles(event)" class="w-full md:w-1/2 flex gap-2">
                <input type="file" id="file-upload-input" multiple required accept=".pdf" class="flex-grow px-3 py-2 bg-white rounded-lg border border-blue-200 text-sm text-gray-600 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                <button type="submit" class="px-5 py-2.5 bg-green-600 text-white text-sm font-semibold rounded-lg hover:bg-green-700 transition shadow-sm whitespace-nowrap flex items-center">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Upload
                </button>
            </form>
        </div>

        <!-- Explorer Grid -->
        <div class="bg-white border-x border-b border-gray-200 rounded-b-xl shadow-sm flex-grow p-6">
            <div id="explorer-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
                <!-- Folders and Files injected via JS -->
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
                <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-4 border border-gray-100 shadow-inner">
                    <i class="fa-regular fa-folder-open text-4xl text-gray-300"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-700">Empty Directory</h3>
                <p class="text-sm text-gray-500 mt-1" id="empty-state-text">No files or folders here yet.</p>
            </div>
        </div>

    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        // ==========================================
        // 1. STATE MANAGEMENT (Virtual File System)
        // ==========================================
        const generateId = () => 'id_' + Math.random().toString(36).substr(2, 9);

        // Simulated Database/File System
        const fileSystem = {
            id: 'root',
            name: 'Home',
            type: 'folder',
            children: [
                {
                    id: generateId(),
                    name: '2nd Year 1st Semester',
                    type: 'folder',
                    children: [
                        {
                            id: generateId(),
                            name: 'Classical Mechanics',
                            type: 'folder',
                            children: [
                                { id: generateId(), name: 'Chapter_1_Notes.pdf', type: 'file', size: '2.4 MB' },
                                { id: generateId(), name: 'Chapter_2_Notes.pdf', type: 'file', size: '1.8 MB' },
                                { id: generateId(), name: 'Chapter_3_Notes.pdf', type: 'file', size: '3.1 MB' },
                            ]
                        },
                        {
                            id: generateId(),
                            name: 'Basic Electronics',
                            type: 'folder',
                            children: [
                                { id: generateId(), name: 'V_K_Mehta_Book.pdf', type: 'file', size: '15.6 MB' },
                                { id: generateId(), name: 'Circuit_Diagrams.pdf', type: 'file', size: '4.2 MB' },
                            ]
                        }
                    ]
                },
                { id: generateId(), name: '1st Year 1st Semester', type: 'folder', children: [] }
            ]
        };

        let currentPath = [fileSystem]; // Stack of visited folders
        let isAdmin = false;

        // ==========================================
        // 2. RENDER LOGIC
        // ==========================================
        function renderView() {
            const currentFolder = currentPath[currentPath.length - 1];
            
            // Render Breadcrumbs
            const bcContainer = document.getElementById('breadcrumbs');
            bcContainer.innerHTML = '';
            
            currentPath.forEach((node, index) => {
                const isLast = index === currentPath.length - 1;
                const item = document.createElement('span');
                
                if (isLast) {
                    item.className = 'text-sustblue-900 font-bold bg-blue-100 px-2 py-1 rounded';
                    item.innerHTML = `<i class="fa-solid fa-folder-open text-blue-500 mr-1.5"></i>${node.name}`;
                } else {
                    item.className = 'text-blue-600 hover:text-blue-800 cursor-pointer transition px-1';
                    item.innerHTML = node.name;
                    item.onclick = () => navigateToBreadcrumb(index);
                }
                bcContainer.appendChild(item);

                if (!isLast) {
                    const sep = document.createElement('i');
                    sep.className = 'fa-solid fa-chevron-right text-xs text-gray-400 mx-1 mt-0.5';
                    bcContainer.appendChild(sep);
                }
            });

            // Toggle Admin Action Bar
            const actionBar = document.getElementById('admin-action-bar');
            if (isAdmin) {
                actionBar.classList.remove('hidden');
                actionBar.classList.add('flex');
            } else {
                actionBar.classList.add('hidden');
                actionBar.classList.remove('flex');
            }

            // Render Grid
            const grid = document.getElementById('explorer-grid');
            const emptyState = document.getElementById('empty-state');
            const emptyStateText = document.getElementById('empty-state-text');
            grid.innerHTML = '';

            if (currentFolder.children && currentFolder.children.length > 0) {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                
                // Sort: Folders first, then Files
                const sortedChildren = [...currentFolder.children].sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'folder' ? -1 : 1;
                });

                sortedChildren.forEach(item => {
                    if (item.type === 'folder') grid.appendChild(createFolderCard(item));
                    else if (item.type === 'file') grid.appendChild(createFileCard(item));
                });
            } else {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                emptyStateText.innerText = isAdmin ? "Create a folder or upload files here." : "Admin hasn't uploaded any resources here yet.";
            }
        }

        function createFolderCard(folder) {
            const div = document.createElement('div');
            div.className = 'explorer-card bg-gray-50 border border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer select-none text-center h-36 group';
            div.onclick = () => navigateInto(folder);
            
            div.innerHTML = `
                <div class="mb-3 text-sustblue-500 group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-folder text-5xl drop-shadow-sm"></i>
                </div>
                <span class="font-semibold text-gray-700 text-sm w-full leading-tight truncate px-1" title="${folder.name}">${folder.name}</span>
            `;
            return div;
        }

        function createFileCard(file) {
            const div = document.createElement('div');
            div.className = 'explorer-card bg-gray-50 border border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer select-none text-center h-36 group';
            
            div.onclick = () => {
                if (file.url) {
                    window.open(file.url, '_blank');
                } else {
                    showToast(`Opening document: ${file.name}`, 'info');
                }
            };
            
            div.innerHTML = `
                <div class="mb-3 text-red-500 group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-file-pdf text-5xl drop-shadow-sm"></i>
                </div>
                <span class="font-medium text-gray-800 text-xs w-full truncate px-1" title="${file.name}">${file.name}</span>
                <span class="text-[10px] text-gray-500 mt-1 font-semibold bg-gray-200 px-2 py-0.5 rounded">${file.size}</span>
            `;
            return div;
        }

        // ==========================================
        // 3. NAVIGATION LOGIC
        // ==========================================
        function navigateInto(folderNode) {
            currentPath.push(folderNode);
            renderView();
        }

        function navigateToBreadcrumb(index) {
            currentPath = currentPath.slice(0, index + 1);
            renderView();
        }

        function resetToHome() {
            currentPath = [fileSystem];
            renderView();
        }

        // ==========================================
        // 4. ADMIN & AUTH LOGIC
        // ==========================================
        const authModal = document.getElementById('auth-modal');
        const authContent = document.getElementById('auth-modal-content');
        const passInput = document.getElementById('admin-password');
        const btnAdminToggle = document.getElementById('btn-admin-toggle');
        const roleBadge = document.getElementById('role-badge');

        function toggleAdminAuth() {
            if (isAdmin) {
                // Logout
                isAdmin = false;
                roleBadge.classList.add('hidden');
                btnAdminToggle.innerHTML = '<i class="fa-solid fa-lock mr-1.5"></i> Admin Access';
                btnAdminToggle.classList.remove('bg-red-50', 'text-red-600', 'border-red-200');
                btnAdminToggle.classList.add('text-gray-200', 'hover:bg-sustblue-800', 'border-transparent');
                showToast('Logged out of Admin mode.', 'info');
                renderView();
            } else {
                // Open Login Modal
                authModal.classList.remove('hidden');
                setTimeout(() => {
                    authModal.classList.remove('opacity-0');
                    authContent.classList.remove('scale-95');
                    passInput.focus();
                }, 10);
            }
        }

        function closeAdminAuth() {
            authModal.classList.add('opacity-0');
            authContent.classList.add('scale-95');
            setTimeout(() => {
                authModal.classList.add('hidden');
                passInput.value = '';
            }, 300);
        }

        function verifyAdmin(event) {
            event.preventDefault();
            if (passInput.value === '1234') {
                isAdmin = true;
                closeAdminAuth();
                roleBadge.classList.remove('hidden');
                btnAdminToggle.innerHTML = '<i class="fa-solid fa-right-from-bracket mr-1.5"></i> Logout Admin';
                
                // Style button for logout
                btnAdminToggle.classList.remove('text-gray-200', 'hover:bg-sustblue-800', 'border-transparent');
                btnAdminToggle.classList.add('bg-white', 'text-red-600', 'border-red-200', 'hover:bg-red-50');
                
                showToast('Admin Access Granted. You can now manage files.', 'success');
                renderView();
            } else {
                showToast('Incorrect Password!', 'error');
                passInput.value = '';
                passInput.focus();
            }
        }

        // ==========================================
        // 5. FILE SYSTEM MUTATION LOGIC (Admin Only)
        // ==========================================
        function createFolder(event) {
            event.preventDefault();
            if (!isAdmin) return;

            const input = document.getElementById('new-folder-name');
            const folderName = input.value.trim();
            const currentFolder = currentPath[currentPath.length - 1];

            if (folderName) {
                currentFolder.children.push({
                    id: generateId(),
                    name: folderName,
                    type: 'folder',
                    children: []
                });
                showToast(`Folder "${folderName}" created successfully!`, 'success');
                input.value = '';
                renderView();
            }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function uploadFiles(event) {
            event.preventDefault();
            if (!isAdmin) return;

            const input = document.getElementById('file-upload-input');
            const currentFolder = currentPath[currentPath.length - 1];
            
            const scriptUrl = "https://script.google.com/macros/s/AKfycbxd4ZmxTZPuQ91gE5N7Bnx8iuW1FFVi2HAVGzQO2e85oKBwoZqgMdgzsc13pIfYtSJy3Q/exec";

            if (input.files.length > 0) {
                showToast(`Uploading ${input.files.length} file(s)... Please wait.`, 'info');

                for (let i = 0; i < input.files.length; i++) {
                    const file = input.files[i];
                    try {
                        const base64Data = await getBase64(file);
                        
                        const formData = new URLSearchParams();
                        formData.append('fileData', base64Data);
                        formData.append('mimeType', file.type);
                        formData.append('fileName', file.name);

                        const response = await fetch(scriptUrl, {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();

                        if (result.status === "success") {
                            // ড্রাইভের লিংকসহ ফাইল সেভ করা হচ্ছে
                            currentFolder.children.push({
                                id: generateId(),
                                name: file.name,
                                type: 'file',
                                size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                                url: result.url 
                            });
                            showToast(`"${file.name}" uploaded successfully!`, 'success');
                        } else {
                            showToast(`Failed to upload "${file.name}": ${result.message}`, 'error');
                        }
                    } catch (error) {
                        showToast(`Error uploading "${file.name}". Check console.`, 'error');
                        console.error(error);
                    }
                }
                
                input.value = ''; 
                renderView();
            }
        }

        // ==========================================
        // 6. TOAST NOTIFICATION UTILITY
        // ==========================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const config = {
                success: { bg: 'bg-green-600', icon: 'fa-check-circle', title: 'Success' },
                error: { bg: 'bg-red-600', icon: 'fa-exclamation-circle', title: 'Error' },
                info: { bg: 'bg-blue-600', icon: 'fa-info-circle', title: 'Info' }
            };
            const c = config[type];
            
            toast.className = `flex items-center px-4 py-3 rounded-xl shadow-lg text-white transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto ${c.bg}`;
            toast.innerHTML = `
                <i class="fa-solid ${c.icon} mr-3 text-xl"></i>
                <div class="flex flex-col">
                    <span class="font-bold text-sm leading-tight">${c.title}</span>
                    <span class="font-medium text-xs mt-0.5 opacity-90">${message}</span>
                </div>
            `;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize App on window load
        window.onload = renderView;

    </script>
</body>
</html>
