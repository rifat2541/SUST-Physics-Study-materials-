    <script>
        // ==========================================
        // HISTORY API LOGIC (Fixing Back Button)
        // ==========================================
        
        const ROOT_DRIVE_FOLDER_ID = "1PcgWP2Hh6wr_5PpiGOQeRqoIM5zSAXeA"; 
        const INITIAL_PATH = [{ id: 'root', name: 'Home', driveId: ROOT_DRIVE_FOLDER_ID }];
        let currentPath = [...INITIAL_PATH];

        // Push initial state
        window.history.replaceState({ path: [...currentPath] }, "");

        window.onpopstate = function(event) {
            if (event.state && event.state.path) {
                // User pressed back button, restore the path perfectly
                currentPath = [...event.state.path];
                
                const explorer = document.getElementById('explorer-main');
                const calculator = document.getElementById('cgpa-calculator');
                
                if (event.state.view === 'calc') {
                    explorer.classList.add('hidden');
                    calculator.classList.remove('hidden');
                } else {
                    explorer.classList.remove('hidden');
                    calculator.classList.add('hidden');
                    fetchCurrentFolderData();
                }
            } else {
                resetToHome();
            }
        };


        // ==========================================
        // DARK MODE LOGIC
        // ==========================================
        function initTheme() {
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if(icon) icon.classList.replace('fa-moon', 'fa-sun');
                if(text) text.innerText = 'Light';
            } else {
                document.documentElement.classList.remove('dark');
                if(icon) icon.classList.replace('fa-sun', 'fa-moon');
                if(text) text.innerText = 'Dark';
            }
        }
        initTheme();

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                if(icon) icon.classList.replace('fa-sun', 'fa-moon');
                if(text) text.innerText = 'Dark';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                if(icon) icon.classList.replace('fa-moon', 'fa-sun');
                if(text) text.innerText = 'Light';
            }
        }

        // ==========================================
        // GPA CALCULATOR LOGIC
        // ==========================================
        const gradePoints = { "A+": 4.00, "A": 3.75, "A-": 3.50, "B+": 3.25, "B": 3.00, "B-": 2.75, "C+": 2.50, "C": 2.25, "D": 2.00, "F": 0.00 };

        function toggleCalculator() {
            const explorer = document.getElementById('explorer-main');
            const calculator = document.getElementById('cgpa-calculator');
            
            if (calculator.classList.contains('hidden')) {
                explorer.classList.add('hidden');
                calculator.classList.remove('hidden');
                if (document.getElementById('course-rows-container').children.length === 0) {
                    for(let i=0; i<5; i++) addCourseRow();
                }
                window.history.pushState({ path: [...currentPath], view: 'calc' }, "");
            } else {
                explorer.classList.remove('hidden');
                calculator.classList.add('hidden');
                window.history.pushState({ path: [...currentPath] }, "");
            }
        }

        function addCourseRow() {
            const container = document.getElementById('course-rows-container');
            const rowDiv = document.createElement('div');
            rowDiv.className = 'flex flex-col sm:flex-row gap-2 sm:gap-3 items-center course-row bg-white dark:bg-gray-800 p-3 sm:p-0 border border-gray-200 dark:border-gray-700 sm:border-0 rounded-xl sm:rounded-none shadow-sm sm:shadow-none transition-colors duration-300';
            
            let optionsHtml = '<option value="">Select Grade</option>';
            for (let grade in gradePoints) { optionsHtml += `<option value="${grade}">${grade} (${gradePoints[grade].toFixed(2)})</option>`; }

        function calculateCGPA() {
            const rows = document.querySelectorAll('.course-row');
            let currentTotalCredits = 0; let currentTotalPoints = 0;
            rows.forEach(row => {
                const creditInput = row.querySelector('.course-credit').value;
                const gradeInput = row.querySelector('.course-grade').value;
                if (creditInput && gradeInput) {
                    const credits = parseFloat(creditInput);
                    const gradePoint = gradePoints[gradeInput];
                    currentTotalCredits += credits;
                    currentTotalPoints += (credits * gradePoint);
                }
            });

            let sgpa = currentTotalCredits > 0 ? (currentTotalPoints / currentTotalCredits) : 0;
            document.getElementById('res-sgpa').innerText = sgpa.toFixed(2);
            
            if(sgpa > 0) { document.getElementById('btn-print').classList.remove('hidden'); showToast('GPA Calculated Successfully!', 'success'); } 
            else { showToast('Please enter valid credits and grades.', 'error'); }
        }

                    formData.append('action', 'renameItem');
                    formData.append('itemId', driveId);

                    formData.append('itemType', type);

                    const response = await fetch(scriptUrl, { method: 'POST', body: formData });

                    if(result.status !== "success") {
                        console.warn("Drive Rename Failed:", result.message);

                const itemRef = window.doc(window.db, "resources", docId);

        window.downloadFile = function(event, url, fileName) {

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = error => reject(error);
            });
        }

        async function uploadFiles(event) {
            event.preventDefault();
            if (!isAdmin || !window.db) return;
            const input = document.getElementById('file-upload-input');
            const currentFirebaseFolderId = currentPath[currentPath.length - 1].id; const currentDriveFolderId = currentPath[currentPath.length - 1].driveId;
            if (input.files.length > 0) {
                showToast(`Uploading...`, 'info'); showLoader();
                for (let i = 0; i < input.files.length; i++) {
                    const file = input.files[i];
                    try {
                        const base64Data = await getBase64(file);
                        const formData = new URLSearchParams(); formData.append('action', 'uploadFile'); formData.append('fileData', base64Data); formData.append('mimeType', file.type); formData.append('fileName', file.name); formData.append('parentFolderId', currentDriveFolderId);
                        const response = await fetch(scriptUrl, { method: 'POST', body: formData }); const result = await response.json();
                        if (result.status === "success") {
                            await window.addDoc(window.collection(window.db, "resources"), { name: file.name, type: 'file', size: (file.size / (1024 * 1024)).toFixed(2) + ' MB', url: result.url, parentId: currentFirebaseFolderId, createdAt: window.serverTimestamp() });
                            showToast(`Uploaded ${file.name}!`, 'success');
                        } else { showToast(`Failed: ${result.message}`, 'error'); }
                    } catch (error) { console.error(error); showToast(`Error uploading.`, 'error'); }
                }
                input.value = ''; fetchCurrentFolderData(); 
            }
        }

            const c = config[type];
            toast.className = `flex items-center px-3 sm:px-4 py-2 sm:py-3 rounded-xl shadow-lg text-white transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto ${c.bg}`;
            toast.innerHTML = `<i class="fa-solid ${c.icon} mr-2 sm:mr-3 text-lg sm:text-xl"></i><div class="flex flex-col"><span class="font-bold text-xs sm:text-sm leading-tight">${c.title}</span><span class="font-medium text-[10px] sm:text-xs mt-0.5 opacity-90">${message}</span></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }
    </script>
</body>
</html>
