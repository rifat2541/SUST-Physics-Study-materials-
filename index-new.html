<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUST Physics — Study Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6FB;
    --surface:#FFFFFF;
    --border:#E2E8F0;
    --ink:#0F172A;
    --ink-soft:#64748B;
    --accent:#4F46E5;
    --accent2:#7C3AED;
    --radius:12px;
    --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  a{color:inherit;}

  /* Header */
  .header{background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 100%);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center;position:relative;overflow:hidden;}
  .header::before{content:'ψ';position:absolute;font-size:14rem;font-weight:700;opacity:.06;right:-1rem;top:-2rem;line-height:1;pointer-events:none;font-family:serif;}
  .header-inner{max-width:620px;margin:0 auto;position:relative;}
  .dept-tag{display:inline-block;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .9rem;margin-bottom:1rem;}
  .header h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.9rem,5vw,3rem);font-weight:700;line-height:1.1;margin-bottom:.6rem;}
  .header p{font-size:.92rem;opacity:.8;line-height:1.6;}

  /* Search */
  .search-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:.9rem 1.5rem;position:sticky;top:0;z-index:10;box-shadow:0 1px 0 var(--border);}
  .search-wrap{position:relative;max-width:480px;margin:0 auto;}
  .search-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-soft);fill:none;}
  #searchInput{width:100%;padding:.6rem .9rem .6rem 2.4rem;border:1.5px solid var(--border);border-radius:999px;background:var(--bg);font-family:'Inter',sans-serif;font-size:.9rem;color:var(--ink);transition:border-color .15s;}
  #searchInput::placeholder{color:#A0AEC0;}
  #searchInput:focus{outline:none;border-color:var(--accent);background:#fff;}

  /* Nav bar */
  .nav-bar{max-width:1100px;margin:0 auto;padding:1.1rem 1.5rem .2rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
  #backBtn{font-size:.8rem;font-weight:600;background:none;border:1.5px solid var(--border);border-radius:999px;padding:.32rem .85rem;cursor:pointer;color:var(--ink-soft);transition:all .15s;font-family:'Inter',sans-serif;}
  #backBtn:hover{border-color:var(--accent);color:var(--accent);}
  .breadcrumb{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;font-size:.78rem;font-weight:500;}
  .crumb{background:none;border:none;padding:0;cursor:pointer;color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:inherit;font-weight:inherit;}
  .crumb:last-child{color:var(--ink);font-weight:700;cursor:default;}
  .crumb:not(:last-child):hover{color:var(--accent);}
  .crumb-sep{color:#CBD5E1;font-size:.8rem;}

  /* Grid */
  main{padding:.8rem 1.5rem 3rem;max-width:1100px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-top:.8rem;}

  /* Nav cards */
  .nav-card{
    display:flex;align-items:center;justify-content:space-between;gap:.8rem;
    background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
    padding:1.1rem 1rem 1.1rem 1.2rem;cursor:pointer;text-align:left;
    font-family:'Inter',sans-serif;color:var(--ink);
    box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s,transform .15s;
  }
  .nav-card:hover{box-shadow:0 4px 20px rgba(79,70,229,0.12);border-color:var(--accent);transform:translateY(-1px);}
  .nav-card-content{flex:1;min-width:0;}
  .nav-card-label{font-size:.68rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem;}
  .nav-card-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1rem;line-height:1.3;color:var(--ink);}
  .nav-card-meta{font-size:.78rem;color:var(--ink-soft);margin-top:.25rem;}
  .nav-card-arrow{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft);font-size:1.1rem;transition:background .15s,color .15s;}
  .nav-card:hover .nav-card-arrow{background:var(--accent);color:#fff;}

  /* Category card stripe */
  .nav-card.cat{border-top:3px solid var(--accent);}

  /* File cards */
  .file-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow);}
  .file-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;gap:.5rem;}
  .badge{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#fff;padding:.22rem .55rem;border-radius:999px;white-space:nowrap;}
  .course-code{font-size:.7rem;font-weight:600;color:var(--ink-soft);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:.18rem .5rem;}
  .file-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.98rem;line-height:1.35;color:var(--ink);margin-bottom:.9rem;}
  .file-meta{font-size:.78rem;color:var(--ink-soft);margin-bottom:.9rem;}
  .drive-link{display:inline-flex;align-items:center;gap:.35rem;font-size:.83rem;font-weight:600;text-decoration:none;color:var(--accent);background:rgba(79,70,229,0.07);border-radius:999px;padding:.35rem .8rem;transition:background .15s;}
  .drive-link:hover{background:rgba(79,70,229,0.15);}
  .drive-link::after{content:"↗";}

  .empty{text-align:center;color:var(--ink-soft);font-size:.9rem;padding:3rem 1rem;}
  footer{text-align:center;font-size:.72rem;color:var(--ink-soft);padding:1rem 1rem 2rem;}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <span class="dept-tag">Department of Physics · SUST, Sylhet</span>
    <h1>SUST Physics Hub</h1>
    <p>Maintained by the Class Representatives &mdash; browse by semester, course, and category.</p>
  </div>
</header>

<div class="search-bar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="searchInput" placeholder="Search by title, course name, or code&hellip;">
  </div>
</div>

<main>
  <div class="nav-bar">
    <button id="backBtn" type="button" hidden>&larr; Back</button>
    <nav class="breadcrumb" id="breadcrumb"></nav>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="emptyMsg" hidden></p>
</main>

<footer id="footer"></footer>

<script>
const CATEGORIES=["Notes","Sheets","TT Question","Semester Final Question","Books"];
const CAT_HAS_SUBFOLDERS=["Notes","Sheets"];
const SUBFOLDERS=["Previous","2023-24","2024-25","2025-26"];
const SEMESTER_ORDER=["1st Year, 1st Semester","1st Year, 2nd Semester","2nd Year, 1st Semester","2nd Year, 2nd Semester","3rd Year, 1st Semester","3rd Year, 2nd Semester","4th Year, 1st Semester","4th Year, 2nd Semester"];
const CAT_COLOR={"Notes":"#4F46E5","Sheets":"#D97706","TT Question":"#059669","Semester Final Question":"#7C3AED","Books":"#0284C7"};

const materials=[
  {title:"Classical Mechanics — Lecture Notes (Ch 1–4)",course:"Classical Mechanics",code:"PHY-2207",semester:"2nd Year, 2nd Semester",category:"Notes",subfolder:"2024-25",link:"https://drive.google.com/REPLACE_ME"},
  {title:"Classical Mechanics — Previous Lecture Notes",course:"Classical Mechanics",code:"PHY-2207",semester:"2nd Year, 2nd Semester",category:"Notes",subfolder:"Previous",link:"https://drive.google.com/REPLACE_ME"},
  {title:"Classical Mechanics — Problem Sheet 1",course:"Classical Mechanics",code:"PHY-2207",semester:"2nd Year, 2nd Semester",category:"Sheets",subfolder:"2024-25",link:"https://drive.google.com/REPLACE_ME"},
  {title:"Classical Mechanics — TT Question 2025",course:"Classical Mechanics",code:"PHY-2207",semester:"2nd Year, 2nd Semester",category:"TT Question",link:"https://drive.google.com/REPLACE_ME"},
  {title:"Classical Mechanics — Semester Final 2024",course:"Classical Mechanics",code:"PHY-2207",semester:"2nd Year, 2nd Semester",category:"Semester Final Question",link:"https://drive.google.com/REPLACE_ME"},
  {title:"Electricity & Magnetism — Lecture Notes",course:"Electricity & Magnetism",code:"PHY-2208",semester:"2nd Year, 2nd Semester",category:"Notes",subfolder:"2024-25",link:"https://drive.google.com/REPLACE_ME"},
  {title:"Quantum Mechanics I — Lecture Notes",course:"Quantum Mechanics I",code:"PHY-3101",semester:"3rd Year, 1st Semester",category:"Notes",subfolder:"2024-25",link:"https://drive.google.com/REPLACE_ME"},
  {title:"Quantum Mechanics I — Griffiths",course:"Quantum Mechanics I",code:"PHY-3101",semester:"3rd Year, 1st Semester",category:"Books",link:"https://drive.google.com/REPLACE_ME"}
];

let view={search:"",path:[]};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function orderedSemesters(){const d=[...new Set(materials.map(m=>m.semester))];return d.sort((a,b)=>{const ia=SEMESTER_ORDER.indexOf(a),ib=SEMESTER_ORDER.indexOf(b);return(ia<0?999:ia)-(ib<0?999:ib);});}
function coursesIn(sem){const map=new Map();materials.filter(m=>m.semester===sem).forEach(m=>{if(!map.has(m.code))map.set(m.code,{code:m.code,name:m.course});});return[...map.values()];}
function courseNameFor(code,sem){const m=materials.find(x=>x.code===code&&(!sem||x.semester===sem));return m?m.course:code;}
function arrow(){return`<span class="nav-card-arrow">›</span>`;}

function buildBreadcrumb(){
  const p=view.path;const labels=["Home"];
  if(p[0])labels.push(p[0]);if(p[1])labels.push(courseNameFor(p[1],p[0]));if(p[2])labels.push(p[2]);if(p[3])labels.push(p[3]);
  $("breadcrumb").innerHTML=labels.map((l,i)=>`<button class="crumb" data-i="${i}">${esc(l)}</button>`).join('<span class="crumb-sep">/</span>');
  $("breadcrumb").querySelectorAll(".crumb").forEach((btn,i)=>{if(i===labels.length-1)return;btn.addEventListener("click",()=>{view.path=view.path.slice(0,i);render();});});
}

function renderHome(){
  $("grid").innerHTML=orderedSemesters().map(sem=>{
    const cc=coursesIn(sem).length,fc=materials.filter(m=>m.semester===sem).length;
    return`<button class="nav-card" data-val="${esc(sem)}"><div class="nav-card-content"><div class="nav-card-title">${esc(sem)}</div><div class="nav-card-meta">${cc} course${cc!==1?"s":""} &middot; ${fc} file${fc!==1?"s":""}</div></div>${arrow()}</button>`;
  }).join("");
  $("grid").querySelectorAll(".nav-card").forEach(btn=>{btn.addEventListener("click",()=>{view.path=[btn.dataset.val];render();});});
}

function renderCourses(sem){
  $("grid").innerHTML=coursesIn(sem).map(c=>{
    const fc=materials.filter(m=>m.semester===sem&&m.code===c.code).length;
    return`<button class="nav-card" data-val="${esc(c.code)}"><div class="nav-card-content"><div class="nav-card-label">${esc(c.code)}</div><div class="nav-card-title">${esc(c.name)}</div><div class="nav-card-meta">${fc} file${fc!==1?"s":""}</div></div>${arrow()}</button>`;
  }).join("");
  $("grid").querySelectorAll(".nav-card").forEach(btn=>{btn.addEventListener("click",()=>{view.path=[sem,btn.dataset.val];render();});});
}

function renderCategories(sem,code){
  $("grid").innerHTML=CATEGORIES.map(cat=>{
    const count=materials.filter(m=>m.semester===sem&&m.code===code&&m.category===cat).length;
    const color=CAT_COLOR[cat]||"#4F46E5";const hasSub=CAT_HAS_SUBFOLDERS.includes(cat);
    return`<button class="nav-card cat" data-val="${esc(cat)}" style="border-top-color:${color}"><div class="nav-card-content"><div class="nav-card-title">${esc(cat)}</div><div class="nav-card-meta">${count?count+" file"+(count!==1?"s":""):"Nothing here yet"}${hasSub?" &middot; "+SUBFOLDERS.length+" folders":""}</div></div>${arrow()}</button>`;
  }).join("");
  $("grid").querySelectorAll(".nav-card").forEach(btn=>{btn.addEventListener("click",()=>{view.path=[sem,code,btn.dataset.val];render();});});
}

function renderSubfolders(sem,code,cat){
  const color=CAT_COLOR[cat]||"#4F46E5";
  $("grid").innerHTML=SUBFOLDERS.map(sf=>{
    const count=materials.filter(m=>m.semester===sem&&m.code===code&&m.category===cat&&m.subfolder===sf).length;
    return`<button class="nav-card" data-val="${esc(sf)}" style="border-top:3px solid ${color}"><div class="nav-card-content"><div class="nav-card-title">${esc(sf)}</div><div class="nav-card-meta">${count?count+" file"+(count!==1?"s":""):"Nothing here yet"}</div></div>${arrow()}</button>`;
  }).join("");
  $("grid").querySelectorAll(".nav-card").forEach(btn=>{btn.addEventListener("click",()=>{view.path=[sem,code,cat,btn.dataset.val];render();});});
}

function renderFiles(sem,code,cat,subfolder){
  const files=materials.filter(m=>{const base=m.semester===sem&&m.code===code&&m.category===cat;return subfolder?base&&m.subfolder===subfolder:base;});
  if(!files.length){$("grid").innerHTML="";$("emptyMsg").hidden=false;$("emptyMsg").textContent="No files uploaded here yet. Check back soon!";return;}
  const color=CAT_COLOR[cat]||"#4F46E5";
  $("grid").innerHTML=files.map(f=>`
    <article class="file-card">
      <div class="file-card-top">
        <span class="badge" style="background:${color}">${esc(cat)}</span>
        <span class="course-code">${esc(f.code)}</span>
      </div>
      <div class="file-title">${esc(f.title)}</div>
      <a class="drive-link" href="${esc(f.link)}" target="_blank" rel="noopener">Open in Drive</a>
    </article>`).join("");
}

function renderSearch(term){
  const hits=materials.filter(m=>m.title.toLowerCase().includes(term)||m.course.toLowerCase().includes(term)||m.code.toLowerCase().includes(term)||m.category.toLowerCase().includes(term));
  $("breadcrumb").innerHTML=`<span class="crumb" style="cursor:default;color:var(--ink);font-weight:700">Search results</span>`;
  if(!hits.length){$("grid").innerHTML="";$("emptyMsg").hidden=false;$("emptyMsg").textContent=`No files match "${term}". Try a different name or code.`;return;}
  $("grid").innerHTML=hits.map(m=>{const color=CAT_COLOR[m.category]||"#4F46E5";return`<article class="file-card"><div class="file-card-top"><span class="badge" style="background:${color}">${esc(m.category)}</span><span class="course-code">${esc(m.code)}</span></div><div class="file-title">${esc(m.title)}</div><p class="file-meta">${esc(m.semester)} &middot; ${esc(m.course)}${m.subfolder?" &middot; "+esc(m.subfolder):""}</p><a class="drive-link" href="${esc(m.link)}" target="_blank" rel="noopener">Open in Drive</a></article>`;}).join("");
}

function render(){
  $("grid").innerHTML="";$("emptyMsg").hidden=true;
  $("backBtn").hidden=view.path.length===0||!!view.search;
  const term=view.search.trim().toLowerCase();
  if(term){renderSearch(term);return;}
  buildBreadcrumb();
  const p=view.path;
  if(p.length===0)renderHome();
  else if(p.length===1)renderCourses(p[0]);
  else if(p.length===2)renderCategories(p[0],p[1]);
  else if(p.length===3){if(CAT_HAS_SUBFOLDERS.includes(p[2]))renderSubfolders(p[0],p[1],p[2]);else renderFiles(p[0],p[1],p[2],null);}
  else if(p.length===4)renderFiles(p[0],p[1],p[2],p[3]);
}

const totalCourses=new Set(materials.map(m=>m.code)).size;
$("footer").textContent=`${materials.length} files · ${totalCourses} courses · SUST Physics Department`;
$("backBtn").addEventListener("click",()=>{view.path=view.path.slice(0,-1);render();});
$("searchInput").addEventListener("input",e=>{view.search=e.target.value;render();});
render();
</script>
</body>
</html>
